<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split View</title>
<style>
  :root {
    --app-bg: #000432;
    --th-frame: color-mix(in srgb, var(--app-bg) 55%, #000000);
    --th-omni: color-mix(in srgb, var(--app-bg) 35%, #000000);
  }

  /* ══════ Browser bars: tab bar + address bar + bookmark bar ══════ */
  .bb-tabbar {
    flex: 0 0 38px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 4px 8px 0;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
        background: var(--app-bg);
    border-top: 1px solid #ffffff;
    z-index: 5;
  }
  .bb-tabbar::-webkit-scrollbar { display: none; }
  .bb-tab {
    position: relative;
    flex: 0 1 180px;
    min-width: 64px;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px 0 12px;
    color: rgba(255, 255, 255, 0.65);
    font: 12px system-ui, -apple-system, "Segoe UI", sans-serif;
    white-space: nowrap;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .bb-tab:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
    .bb-tab.active { background: rgba(255, 255, 255, 0.16); color: #ffffff; }
  .bb-tab-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .bb-tab-x, .bb-tab-new, .bb-btn {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    color: #ffffff;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
  }
  .bb-tab-x { flex: 0 0 18px; width: 18px; height: 18px; font-size: 13px; opacity: 0.7; }
  .bb-tab-x:hover, .bb-tab-new:hover, .bb-btn:hover { background: rgba(255, 255, 255, 0.18); opacity: 1; }
  .bb-tab-new { flex: 0 0 26px; width: 26px; height: 26px; align-self: center; margin-left: 4px; font-size: 18px; }

  .bb-navrow {
    flex: 0 0 38px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px;
    min-width: 0;
    background: var(--app-bg);
    z-index: 5;
  }
  .bb-half { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .bb-btn { flex: 0 0 26px; width: 26px; height: 26px; font-size: 13px; font-weight: 600; }
  .bb-omni {
    flex: 1 1 auto;
    min-width: 0;
    height: 26px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 3px 0 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
  }
    .bb-omni:focus-within { background: var(--app-bg); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5); }
  .bb-omni input {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    background: transparent;
    border: 0;
    outline: 0;
    color: #ffffff;
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .bb-omni input::placeholder { color: rgba(255, 255, 255, 0.55); }
  .bb-marks {
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-left: 10px;
    border-left: 1px solid rgba(255, 255, 255, 0.25);
  }
  .bb-marks::-webkit-scrollbar { display: none; }
  .bb-mark {
    flex: 0 0 auto;
    max-width: 140px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0 4px 0 10px;
    border-radius: 999px;
    color: #ffffff;
    font: 12px system-ui, -apple-system, "Segoe UI", sans-serif;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .bb-mark:hover { background: rgba(255, 255, 255, 0.15); }
  .bb-mark-title { overflow: hidden; text-overflow: ellipsis; }
    .bb-mark-x { width: 16px; height: 16px; font-size: 12px; opacity: 0.6; }
  .bb-hint { color: rgba(255, 255, 255, 0.45); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; white-space: nowrap; }

  /* Address-bar suggestions (opens upward, like Chrome at the bottom of the window) */
  .bb-navrow { position: relative; z-index: 60; }
  .bb-sugg {
    position: absolute;
    left: 0;
    bottom: calc(100% + 6px);
    width: max(100%, 300px);
    max-width: 94vw;
    padding: 4px;
    background: var(--app-bg);
    border: 1px solid #ffffff;
    border-radius: 12px;
    box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.55);
    z-index: 100;
    overflow: hidden;
  }
  .bb-sg {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    color: #ffffff;
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .bb-sg:hover, .bb-sg.sel { background: rgba(255, 255, 255, 0.16); }
  .bb-sg-ico {
    flex: 0 0 22px;
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    font-size: 11px;
    font-weight: 600;
  }
  .bb-sg-main { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .bb-sg-sub { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: rgba(255, 255, 255, 0.55); font-size: 12px; }
  .bb-sg-sub::before { content: "\2014\00a0"; }
  :root {
      color-scheme: dark;
      --bg: #0b0f0e;
      --panel: #0b0f0e;
      --elev: #16201d;
      --scrim: rgba(11, 15, 14, 0.6);
      --toast-bg: rgba(22, 32, 29, 0.95);
      --line: #e6efec;
      --line-dim: rgba(230, 239, 236, 0.5);
      --line-width: 1px;
      --text: #e8f0ed;
      --text-dim: rgba(232, 240, 237, 0.4);
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.35);
      --accent-bg: rgba(52, 211, 153, 0.16);
      --accent-bg-strong: rgba(52, 211, 153, 0.25);
      --on-accent: #06231a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

  * { box-sizing: inherit; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    height: 100%;
  }

  body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      overflow: hidden;
    }

  .app {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

  .frame {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border: var(--line-width) solid var(--line);
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

  .panes-wrapper {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
  }

  .taskbar {
      flex: 0 0 38px;
      display: flex;
      align-items: center;
            justify-content: space-between;
          padding: 0 10px;
          background: rgba(0, 0, 0, 0.28);
          border-top: 1px solid rgba(242, 243, 251, 0.14);
          z-index: 5;
          gap: 8px;
      }

      .taskbar-left, .taskbar-right {
          display: flex;
          align-items: center;
          gap: 8px;
      }
      .taskbar-left  { flex: 1 1 auto; min-width: 0; }
      .taskbar-right { flex: 0 0 auto; }

      /* ── AI Compile & Patch Workspace Styles ── */
      .dev-btn {
          background: transparent;
          border: 1px solid var(--line-dim);
      color: var(--text);
      padding: 4px 8px;
      font: bold 11px monospace;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
  }
    .dev-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
            color: var(--on-accent);
      }
      #dev-btn-link {
          background: rgba(255, 255, 255, 0.08);
      }

      #dev-bar {
          display: flex;
          align-items: center;
          gap: 6px;
          width: 100%;
          min-width: 0;
          overflow-x: auto;
          scrollbar-width: none;
      }
      #dev-bar::-webkit-scrollbar { display: none; }

      #dev-control-bar {
          display: flex;
          align-items: center;
          gap: 6px;
          flex: 1 0 auto;
          flex-wrap: nowrap;
      }
      #dev-control-bar > :not(.dev-input) { flex: 0 0 auto; }

      .dev-input {
          flex: 1 1 150px;
          width: auto;
          min-width: 90px;
          height: 24px;
          background: rgba(255, 255, 255, 0.08);
          border: 1px solid var(--line-dim);
          border-radius: 4px;
          color: var(--text);
          font: bold 11px monospace;
          padding: 0 6px;
          outline: none;
      }
      .dev-input:focus { border-color: var(--accent); }

      .dev-toggles {
          display: flex;
          gap: 8px;
          align-items: center;
          background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line-dim);
      border-radius: 4px;
      padding: 0 8px;
      height: 24px;
  }
  .dev-toggles label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font: bold 10px monospace;
      color: var(--text);
      user-select: none;
  }

  #dev-toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
            padding: 8px 16px;
      font: bold 12px monospace;
      background: var(--elev);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #fff;
      z-index: 5000;
      display: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      pointer-events: none;
  }
  #dev-toast.show { display: block; }

  /* Panes are positioned by index.js from the layout tree (left / top / width / height in %) */
  .pane {
    position: absolute;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  .pane[hidden] { display: none; }
  .pane-body {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  .pane iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
    transform-origin: 0 0;
  }

  .tap-catcher {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
        font-size: 12px;
      color: var(--text-dim);
      background: var(--scrim);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
  .tap-catcher.on { display: flex; }

  .zoom-controls {
      position: absolute;
      bottom: clamp(6px, 1.5vh, 10px);
      right: clamp(8px, 2vw, 12px);
      display: flex;
      gap: clamp(4px, 1vw, 8px);
      z-index: 4;
    }

  .zoom-btn {
      width: clamp(22px, 5vw, 30px);
      height: clamp(22px, 5vw, 30px);
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: clamp(13px, 2.5vw, 16px);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
            opacity: 0.45;
          transition: opacity 0.15s ease, color 0.15s ease;
        }

      .fs-btn svg { width: 1.15em; height: 1.15em; display: block; }
      .fs-btn .ico-exit { display: none; }
      .fs-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      .is-fs .fs-btn .ico-enter { display: none; }
      .is-fs .fs-btn .ico-exit { display: block; }

      /* Page Tiling button (taskbar) */
      .orient-btn svg { width: 1.15em; height: 1.15em; display: block; }
      .orient-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

      .fs-toast {
        position: fixed;
        left: 50%;
    bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    max-width: 90vw;
    padding: 8px 12px;
        border-radius: 8px;
    background: var(--toast-bg);
    color: var(--text);
    font-size: 12px;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .fs-toast.show { opacity: 1; }

  .zoom-btn:hover,
  .zoom-btn:active {
    opacity: 1;
    color: var(--accent);
  }

  .divider {
    flex: 0 0 auto;
    height: 21px;
    margin-top: -10px;
    margin-bottom: -10px;
    position: relative;
    cursor: row-resize;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    touch-action: none;
  }

  .divider::before {
      content: "";
      display: block;
      width: 100%;
      height: var(--line-width);
      background: var(--line);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

  body.is-dragging { cursor: row-resize; user-select: none; -webkit-user-select: none; }
  body.is-dragging .pane iframe { pointer-events: none; }

  .divider:hover::before,
  .divider.active::before {
    background: var(--accent);
  }

  /* ── Site manager popup (exact fit to pane) ── */
  .mgr {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    padding: 0;
    background: transparent;
  }
  .mgr[hidden] { display: none; }
  .mgr-card {
    width: 100%;
    height: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: none;
    border-radius: 0;
    overflow: hidden;
  }
  .mgr-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-dim);
    font-size: 14px;
  }
  .mgr-x {
    background: none;
    border: none;
    color: var(--text);
    font-size: 16px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .mgr [hidden] { display: none !important; }
  .mgr-head-btns { display: flex; align-items: center; gap: 6px; }
  .mgr-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
  }
  .mgr-list { list-style: none; margin: 0; padding: 0; }
  .mgr-hint { margin: 0; padding: 8px 12px 6px; font-size: 11px; color: rgba(238, 240, 251, 0.55); }

  .mgr-grid {
    list-style: none;
    margin: auto 0 0 0;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 8px;
  }
  .mgr-grid li {
    position: relative;
    touch-action: none;
  }
    .mgr-grid li.is-dragging { z-index: 10; }
  .mgr-grid li.is-dragging .mgr-tile {
    transform: scale(1.05);
    border-color: var(--accent);
    background: var(--accent-bg-strong);
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }
  .mgr-tile {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 4px 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(242, 243, 251, 0.18);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
    .mgr-tile:hover, .mgr-tile:active { border-color: var(--accent); }
  .mgr-tile.is-active { border-color: var(--accent); background: var(--accent-bg); }
  .mgr-av {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    flex: 0 0 auto;
  }
  .mgr-tname {
    max-width: 100%;
    font-size: 12px;
    line-height: 1.25;
    text-align: center;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }

  .mgr-handle {
    flex: 0 0 auto;
    width: 30px;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: rgba(238, 240, 251, 0.6);
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
    .mgr-item.is-dragging {
    position: relative;
    z-index: 2;
    background: var(--elev);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
  }
  .mgr-item.is-dragging .mgr-handle { cursor: grabbing; color: var(--accent); }
  .mgr-item.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .mgr-item.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .mgr-item { border-bottom: 1px solid rgba(242, 243, 251, 0.18); }
  .mgr-row { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 4px; }
  .mgr-open {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 8px 8px;
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .mgr-name { font-size: 14px; }
  .mgr-item.is-active .mgr-name::before { content: "\25CF\00a0"; color: var(--accent); }
  .mgr-url {
    max-width: 100%;
    font-size: 11px;
    color: rgba(238, 240, 251, 0.55);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mgr-btn {
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--line-dim);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .mgr-btn.primary { border-color: var(--accent); color: var(--accent); }
  .mgr-btn.danger { border-color: #ff9c9c; color: #ffb4b4; }
  .mgr-btn[disabled] { opacity: 0.3; cursor: default; }
  .mgr-edit { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }
  .mgr-edit-btns { display: flex; gap: 8px; }
  .mgr-in {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line-dim);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    padding: 8px 10px;
    outline: none;
  }
  .mgr-in:focus { border-color: var(--accent); }
  .mgr-add {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--line-dim);
  }
  .mgr-foot {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
        border-top: 1px solid rgba(242, 243, 251, 0.18);
        font-size: 11px;
        color: rgba(238, 240, 251, 0.55);
      }
      .mgr-msg.err { color: #ffb4b4; }

      /* ══════════════════════════════════════════════════════════════
         LIGHT · NEOMORPHIC THEME  (overrides everything above)
         Tweak --bg, --neo-hi, --neo-lo and --accent to re-tint it.
         ══════════════════════════════════════════════════════════════ */
      :root {
                color-scheme: dark;
        --bg: var(--app-bg);
        --panel: var(--app-bg);
        --elev: var(--app-bg);
        --scrim: rgba(0, 4, 50, 0.85);
        --toast-bg: var(--app-bg);
        --line: #ffffff;
        --line-dim: rgba(255, 255, 255, 0.55);
        --text: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.6);
        --accent: #ffffff;
        --accent-soft: rgba(255, 255, 255, 0.35);
        --accent-bg: rgba(255, 255, 255, 0.10);
        --accent-bg-strong: rgba(255, 255, 255, 0.18);
        --on-accent: var(--app-bg);
          --danger: #d64550;
          --neo-hi: #ffffff;
          --neo-lo: #a3b1c6;
          --raise:    0 0 0 1px var(--line);
          --raise-sm: 0 0 0 1px var(--line);

/* ══════════════════════════════════════════════════════════════
   CHROME 1:1 (fresh install look): tab strip, toolbar, bookmarks bar on TOP.
   Everything else (folder, AI box, checkboxes, ▲ ⌘ log, tiling, fullscreen)

#frame {

}
